<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://www.fontsquirrel.com/fonts/barlow" rel="stylesheet">
  <title>Template</title>
</head>

<body>

  <div class="wrapper">

    <div class="left-side">
      <img class="left-side__logo" src="./img/logo.svg" alt="logo">
      <img class="left-side__picture" src="./img/bg.jpg" alt="picture">
    </div>


    <div class="right-side">

      <header class="right-side__header">
        <h1 class="right-side__title">
          Get iintoo it today
        </h1>
        <p class="right-side__text">
          There is no charge or obligation upon registration
        </p>
      </header>



      <div class="registration">

        <button class="registration__facebook"> <img class="icon" src="./img/facebook.svg" alt="icon facebook">
          Register with Facebook
        </button>
        <button class="registration__linkedin"><img class="icon" src="./img/linkedin.svg" alt="icon linkedin">
          Register with Linkedin
        </button>

        <div class="div_line">
          <div class="line line1"></div>or<div class="line line2"></div>
        </div>

        <form action="@">
          <label class="formEmailPhone" for="email">Email</label>
          <input type="email" id="email" name="Email">
          <label class="formEmailPhone" for="phone">Phone</label>
          <input type="text" id="phone" name="Phone Number">
        </form>
        <form action="#">

      </div>

      <!-- question -->

      <div class="choice">

        <h2 class="choice__question">What type of investor are you?</h2>
        <p class="choice__text">Select the type of investor you are below.</p>

        <div class="choice__options_investor">

          <label>
            <input type="radio" name="investor-type" value="individual" id="Individual">
            <span>Individual</span>
            <span class="info">!</span>
            <div class="additional_information1">
              I am a natural person investing on my own behalf as a sole owner, joint
              tenant, or tenant in common.
            </div>
          </label>

          <label>
            <input type="radio" name="investor-type" value="business" id="Business">
            <span>Business</span>
            <span class="info">!</span>
            <div class="additional_information1">
              I am a natural person investing on my own behalf as a sole owner, joint
              tenant, or tenant in common.
            </div>
          </label>

          <label>
            <input type="radio" name="investor-type" value="IRA" id="IRA">
            <span>IRA</span>
            <span class="info">!</span>
            <div class="additional_information1">
              I am a natural person investing on my own behalf as a sole owner, joint
              tenant, or tenant in common.
            </div>
          </label>

          <label>
            <input type="radio" name="investor-type" value="trust" id="Trust">
            <span>Trust</span>
            <span class="info">!</span>
            <div class="additional_information1">
              I am a natural person investing on my own behalf as a sole owner, joint
              tenant, or tenant in common.
            </div>
          </label>

        </div>

      </div>


      <div class="agree-and-button">
        <form action="agree">
          <input type="checkbox">
          <span class="agree-and-button__text">
            I agree to the terms and receiving notification from iintoo
            <a href="@">
              View full terms
            </a>
          </span>
        </form>


        <button class="button-create-acc">Create account</button>

      </div>



    </div>

  </div>



  </div>

</body>


</html>
