<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://www.fontsquirrel.com/fonts/barlow" rel="stylesheet">
  <title>Template</title>
</head>

<body>

  <div class="wrapper">

    <div class="wrapper-picture">
      <img src="./img/logo.svg" alt="logo">
      <img src="./img/bg.jpg" alt="picture">
    </div>


    <div class="wrapper__right_side">

      <header>
        <h1>
          Get iintoo it today
        </h1>
        <p>
          There is no charge or obligation upon registration
        </p>
      </header>



      <div class="registration">
        <button class="facebook"> <img src="./img/facebook.svg" alt="icon facebook">Register with Facebook</button>
        <button class="linkedin"><img src="./img/linkedin.svg" alt="icon linkedin">Register with Linkedin</button>

        <div class="div_line">
          <div class="line line1"></div>or<div class="line line2"></div>
        </div>

        <form action="@">
          <label class="formEmailPhone" for="email">Email</label>
          <input type="email" id="email" name="Email">
          <label class="formEmailPhone" for="phone">Phone</label>
          <input type="number" id="phone" name="Phone Number">
        </form>

        <form action="#">

          <h2>What type of investor are you?</h2>
          <p>Select the type of investor you are below.</p>

          <div class="options_investor">

            <label>
              <input type="radio" name="investor-type" value="individual" id="Individual">
              <span>Individual</span>
              <div class="info">!</div>
              <div class="additional_information1">
                I am a natural person investing on my own behalf as a sole owner, joint
                tenant, or tenant in common.
              </div>
            </label>

            <label>
              <input type="radio" name="investor-type" value="business" id="Business">
              <span>Business</span>
              <div class="info">!</div>
              <div class="additional_information1">
                I am a natural person investing on my own behalf as a sole owner, joint
                tenant, or tenant in common.
              </div>
            </label>

            <label>
              <input type="radio" name="investor-type" value="IRA" id="IRA">
              <span>IRA</span>
              <div class="info">!</div>
              <div class="additional_information1">
                I am a natural person investing on my own behalf as a sole owner, joint
                tenant, or tenant in common.
              </div>
            </label>

            <label>
              <input type="radio" name="investor-type" value="trust" id="Trust">
              <span>Trust</span>
              <div class="info">!</div>
              <div class="additional_information1">
                I am a natural person investing on my own behalf as a sole owner, joint
                tenant, or tenant in common.
              </div>
            </label>

          </div>
        </form>


        <div class="agreeAndButton">
          <form action="agree">
            <input type="checkbox"> <span> I agree to the terms and receiving notification from iintoo <a href="@">View
                full terms</a> </span>
          </form>


          <button class="button_create_acc">Create account</button>

        </div>

      </div>

    </div>

  </div>



  </div>

</body>


</html>
